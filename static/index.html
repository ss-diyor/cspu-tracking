<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XTA 26/5 — Davomat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f5; --surface: #ffffff; --ink: #14212b; --muted: #5d6b76; --line: #d5dde3;
    --accent: #0f6b8f;
    --present: #1f8a4c; --late: #1d6fa5; --excused: #b7791f; --unexcused: #c9342b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f171d; --surface: #17222a; --ink: #e8eef2; --muted: #93a2ad; --line: #2a3943; --accent: #4cb4d8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 Onest, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header, main { max-width: 640px; margin: 0 auto; padding: 14px 16px; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 1.15rem; margin: 0; }
  h2 { font-size: 1rem; margin: 18px 0 8px; }
  nav { display: flex; gap: 6px; margin-bottom: 14px; }
  nav button { flex: 1; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  nav button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row > * { flex: 1; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .hidden { display: none !important; }
  .lessons { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .lessons button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .stu { padding: 10px 0; border-top: 1px solid var(--line); }
  .stu:first-child { border-top: 0; }
  .stu .name { margin-bottom: 6px; font-weight: 500; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .seg button { padding: 7px 2px; font-size: .85rem; }
  .seg button[data-s=present].on { background: var(--present); border-color: var(--present); color: #fff; }
  .seg button[data-s=late].on { background: var(--late); border-color: var(--late); color: #fff; }
  .seg button[data-s=excused].on { background: var(--excused); border-color: var(--excused); color: #fff; }
  .seg button[data-s=unexcused].on { background: var(--unexcused); border-color: var(--unexcused); color: #fff; }
  .readonly .seg { pointer-events: none; }
  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
  .pct { font-weight: 700; }
  #chartMode button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0; font-size: .85rem; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .badge { font-size: .85rem; padding: 2px 8px; border-radius: 99px; color: #fff; }
  .abs-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .abs-row span:last-child { font-weight: 500; }
  .dtitle { font-weight: 500; word-break: break-word; }
  .doc { margin-bottom: 10px; }
  .doc .muted { margin: 2px 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0; }
  .tag { font-size: .8rem; padding: 1px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  .dacts { display: flex; gap: 6px; margin-top: 10px; }
  .dacts .primary { flex: 1; }
  .day { margin: 0 0 14px; }
  .day h2 { margin: 0 0 6px; }
  .day.today h2::after { content: " — bugun"; color: var(--accent); font-weight: 500; }
  .item { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item .time { flex: 0 0 76px; font-size: .9rem; color: var(--muted); }
  .item .time b { display: block; color: var(--ink); }
  .item .info { flex: 1; min-width: 0; }
  .item .subj { font-weight: 500; }
  .item .acts { display: flex; gap: 4px; align-items: flex-start; }
  .item .acts button { padding: 5px 8px; font-size: .85rem; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <h1>XTA 26/5 — Davomat</h1>
  <button id="loginBtn">Starosta kirishi</button>
</header>

<main>
  <nav id="tabs">
    <button data-tab="att" class="on">Davomat</button>
    <button data-tab="stats">Statistika</button>
    <button data-tab="sch">Jadval</button>
    <button data-tab="doc">Hujjatlar</button>
    <button data-tab="stu" class="admin-only hidden">Talabalar</button>
  </nav>

  <!-- DAVOMAT -->
  <section id="tab-att">
    <div class="row">
      <input type="date" id="date">
    </div>
    <div class="row admin-only hidden">
      <input id="subject" placeholder="Fan nomi" list="subjList">
      <datalist id="subjList"></datalist>
      <select id="pair">
        <option value="1">1-juftlik</option><option value="2">2-juftlik</option>
        <option value="3">3-juftlik</option><option value="4">4-juftlik</option>
      </select>
      <button class="primary" id="addLesson" style="flex:0 0 auto">Dars qo'shish</button>
    </div>
    <div id="fromSchedule"></div>
    <div class="lessons" id="lessons"></div>
    <div class="card hidden" id="attCard">
      <div class="muted" id="attTitle"></div>
      <div id="attList"></div>
      <button class="primary admin-only hidden" id="saveAtt" style="width:100%;margin-top:10px">Davomatni saqlash</button>
      <div class="row admin-only hidden" style="margin:8px 0 0">
        <button id="editLesson">Fanni o'zgartirish</button>
        <button id="delLesson">Darsni o'chirish</button>
      </div>
    </div>
  </section>

  <!-- STATISTIKA -->
  <section id="tab-stats" class="hidden">
    <nav id="statMode">
      <button data-m="month" class="on">Oylik</button>
      <button data-m="day">Kunlik</button>
    </nav>

    <div id="statMonth">
      <div class="row">
        <input type="month" id="month">
        <button id="xlsx" class="primary" style="flex:0 0 auto">Excel yuklab olish</button>
      </div>
      <div class="card">
        <div class="row" id="chartMode" style="margin-bottom:6px">
          <button data-c="line" class="on">Chiziq</button>
          <button data-c="bar">Ustun</button>
        </div>
        <div id="chart"></div>
        <div class="legend" id="legend"></div>
        <div class="muted" id="chartInfo" style="min-height:1.4em"></div>
      </div>
      <div class="card tbl" style="margin-top:12px"><table id="statTbl"></table></div>
      <p class="muted">Foiz = (Bor + Kechikdi) / belgilangan darslar soni.</p>
    </div>

    <div id="statDay" class="hidden">
      <div class="row">
        <input type="date" id="statDate">
        <button id="xlsxWeek" class="primary" style="flex:0 0 auto">Haftalik Excel</button>
      </div>
      <div id="dayOut"></div>
    </div>
  </section>

  <!-- JADVAL -->
  <section id="tab-sch" class="hidden">
    <div class="card admin-only hidden" id="schForm">
      <div class="muted" id="schFormTitle">Yangi dars qo'shish</div>
      <div class="row" style="margin-top:8px">
        <select id="sDay">
          <option value="1">Dushanba</option><option value="2">Seshanba</option>
          <option value="3">Chorshanba</option><option value="4">Payshanba</option>
          <option value="5">Juma</option><option value="6">Shanba</option>
        </select>
        <select id="sPair">
          <option value="1">1-juftlik</option><option value="2">2-juftlik</option>
          <option value="3">3-juftlik</option><option value="4">4-juftlik</option>
          <option value="5">5-juftlik</option>
        </select>
      </div>
      <div class="row">
        <input type="time" id="sStart" aria-label="Boshlanish vaqti">
        <input type="time" id="sEnd" aria-label="Tugash vaqti">
      </div>
      <div class="row"><input id="sSubject" placeholder="Fan nomi"></div>
      <div class="row">
        <input id="sRoom" placeholder="Xona (masalan, 305)">
        <input id="sTeacher" placeholder="Ustoz F.I.Sh.">
      </div>
      <div class="row">
        <button class="primary" id="sSave">Qo'shish</button>
        <button id="sCancel" class="hidden">Bekor qilish</button>
      </div>
    </div>
    <div id="schToday"></div>
    <div id="schWeek"></div>
  </section>

  <!-- HUJJATLAR -->
  <section id="tab-doc" class="hidden">
    <div class="card hidden" id="docGate">
      <div class="muted">Hujjatlarni ko'rish uchun guruh kodini kiriting (kod guruh chatida).</div>
      <div class="row" style="margin:8px 0 0">
        <input id="gateCode" type="password" placeholder="Guruh kodi" autocomplete="off">
        <button class="primary" id="gateBtn" style="flex:0 0 auto">Kirish</button>
      </div>
    </div>

    <div id="docMain" class="hidden">
      <div class="row">
        <input id="docQ" type="search" placeholder="Qidirish: nom, izoh, teg">
        <select id="docCat"><option value="">Barcha kategoriyalar</option></select>
      </div>
      <div class="lessons" id="docTags"></div>

      <div class="admin-only hidden">
        <div class="row">
          <button class="primary" id="docAddBtn">+ Hujjat qo'shish</button>
          <button id="catBtn">Kategoriyalar</button>
        </div>

        <div class="card hidden" id="docForm" style="margin-bottom:12px">
          <div class="muted" id="docFormTitle">Yangi hujjat</div>
          <div class="row" style="margin-top:8px"><input id="docTitle" placeholder="Nomi"></div>
          <div class="row"><select id="docCategory"></select></div>
          <div class="row"><input id="docTagsIn" placeholder="Teglar (vergul bilan): imtihon, 1-semestr"></div>
          <div class="row"><textarea id="docNote" rows="2" placeholder="Qisqa izoh (ixtiyoriy)"></textarea></div>
          <div id="docFileBox">
            <div class="muted" id="docFileLabel">Fayl yuklash (25 MB gacha)</div>
            <div class="row" style="margin-top:4px"><input type="file" id="docFile"></div>
          </div>
          <div id="docLinkBox">
            <div class="muted" id="docLinkLabel">yoki havola</div>
            <div class="row" style="margin-top:4px"><input id="docLink" type="url" placeholder="https://..."></div>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="primary" id="docSave">Saqlash</button>
            <button id="docCancel">Bekor qilish</button>
          </div>
        </div>

        <div class="card hidden" id="catBox" style="margin-bottom:12px">
          <div class="row"><input id="catName" placeholder="Yangi kategoriya nomi">
            <button class="primary" id="catAdd" style="flex:0 0 auto">Qo'shish</button></div>
          <div id="catList"></div>
        </div>
      </div>

      <div id="docList"></div>
    </div>
  </section>

  <!-- TALABALAR -->
  <section id="tab-stu" class="hidden">
    <div class="card">
      <div class="muted">Har bir qatorga bitta F.I.Sh.</div>
      <textarea id="names" rows="8" placeholder="Aliyev Vali&#10;Karimova Zilola"></textarea>
      <button class="primary" id="addStu" style="width:100%;margin-top:8px">Talabalarni qo'shish</button>
    </div>
    <h2>Ro'yxat</h2>
    <div class="card" id="stuList"></div>
  </section>
</main>

<script>
const LABEL = { present: "Bor", late: "Kechikdi", excused: "Sababli", unexcused: "Sababsiz" };
const $ = s => document.querySelector(s);
let token = localStorage.getItem("adminToken") || "";
let isAdmin = false;
let lessonId = null;
let marks = {};          // student_id -> status

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = t => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2200); };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Admin-Token": token, "X-Group-Code": groupCode, ...(opts.headers || {}) } });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || "Xatolik yuz berdi"); }
  return res.json();
}

function setAdmin(on) {
  isAdmin = on;
  document.querySelectorAll(".admin-only").forEach(e => e.classList.toggle("hidden", !on));
  $("#loginBtn").textContent = on ? "Chiqish" : "Starosta kirishi";
}

// admin tokenni tekshirish: bo'sh talaba ro'yxatini yuborib ko'ramiz
async function checkToken(t) {
  const r = await fetch("/api/students", { method: "POST", headers: { "Content-Type": "application/json", "X-Admin-Token": t }, body: JSON.stringify({ names: [] }) });
  return r.ok;
}

$("#loginBtn").onclick = async () => {
  if (isAdmin) { token = ""; localStorage.removeItem("adminToken"); setAdmin(false); openLesson(lessonId); loadLessons(); refreshDocsIfOpen(); return; }
  const t = prompt("Starosta paroli:");
  if (!t) return;
  if (await checkToken(t)) { token = t; localStorage.setItem("adminToken", t); setAdmin(true); openLesson(lessonId); loadLessons(); refreshDocsIfOpen(); }
  else toast("Parol noto'g'ri");
};

// Tablar
$("#tabs").onclick = e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["att", "stats", "sch", "doc", "stu"].forEach(n => $("#tab-" + n).classList.toggle("hidden", n !== b.dataset.tab));
  if (b.dataset.tab === "stats") refreshStats();
  if (b.dataset.tab === "sch") loadSchedule();
  if (b.dataset.tab === "doc") openDocs();
  if (b.dataset.tab === "stu") loadStudents();
};

// Darslar
let scheduleLoaded = false;
let lessonsToday = [];

$("#editLesson").onclick = async () => {
  const l = lessonsToday.find(x => x.id === lessonId); if (!l) return;
  const subject = prompt("Fan nomi:", l.subject);
  if (!subject || !subject.trim()) return;
  try {
    await api(`/api/lessons/${l.id}`, { method: "PUT", body: JSON.stringify({ subject: subject.trim(), pair_no: l.pair_no }) });
    toast("O'zgartirildi");
    $("#attTitle").textContent = `${l.pair_no}-juftlik · ${subject.trim()}`;
    await loadLessons();
  } catch (e) { toast(e.message); }
};

$("#delLesson").onclick = async () => {
  if (!lessonId || !confirm("Dars va uning davomati butunlay o'chiriladi. Davom etasizmi?")) return;
  try {
    await api(`/api/lessons/${lessonId}`, { method: "DELETE" });
    lessonId = null; $("#attCard").classList.add("hidden");
    toast("Dars o'chirildi");
    await loadLessons();
  } catch (e) { toast(e.message); }
};

async function ensureSchedule() {
  if (!scheduleLoaded) { schedule = await api("/api/schedule"); scheduleLoaded = true; }
}

// Tanlangan sana hafta kuniga mos darslarni jadvaldan taklif qiladi
async function renderSuggestions(existing) {
  await ensureSchedule();
  const dow = new Date($("#date").value + "T00:00:00").getDay();
  const wd = dow === 0 ? 7 : dow;
  const used = new Set(existing.map(l => l.pair_no));
  const todays = schedule.filter(s => s.weekday === wd && !used.has(s.pair_no));
  $("#fromSchedule").innerHTML = isAdmin && todays.length
    ? '<div class="muted">Jadvaldan tanlang:</div><div class="lessons">' +
      todays.map(s => `<button data-sid="${s.id}">${s.pair_no}-juftlik · ${esc(s.subject)}</button>`).join("") + "</div>"
    : "";
  $("#subjList").innerHTML = [...new Set(schedule.map(s => s.subject))].map(s => `<option value="${esc(s)}">`).join("");
}

$("#fromSchedule").onclick = async e => {
  const b = e.target.closest("button[data-sid]"); if (!b) return;
  const s = schedule.find(x => x.id === +b.dataset.sid); if (!s) return;
  try {
    const l = await api("/api/lessons", { method: "POST", body: JSON.stringify({ lesson_date: $("#date").value, subject: s.subject, pair_no: s.pair_no }) });
    await loadLessons();
    openLesson(l.id, `${l.pair_no}-juftlik · ${l.subject}`);
  } catch (err) { toast(err.message); }
};

async function loadLessons() {
  if (!$("#date").value) return;
  const list = await api("/api/lessons?lesson_date=" + $("#date").value);
  lessonsToday = list;
  renderSuggestions(list);
  const box = $("#lessons");
  box.innerHTML = list.length ? "" : '<span class="muted">Bu kunga dars qo\'shilmagan.</span>';
  list.forEach(l => {
    const b = document.createElement("button");
    b.textContent = `${l.pair_no}-juftlik · ${l.subject}`;
    b.className = l.id === lessonId ? "on" : "";
    b.onclick = () => openLesson(l.id, b.textContent);
    box.append(b);
  });
  if (!list.some(l => l.id === lessonId)) { lessonId = null; $("#attCard").classList.add("hidden"); }
}

$("#addLesson").onclick = async () => {
  const subject = $("#subject").value.trim();
  if (!subject) return toast("Fan nomini yozing");
  try {
    const l = await api("/api/lessons", { method: "POST", body: JSON.stringify({ lesson_date: $("#date").value, subject, pair_no: +$("#pair").value }) });
    $("#subject").value = "";
    await loadLessons();
    openLesson(l.id, `${l.pair_no}-juftlik · ${l.subject}`);
  } catch (e) { toast(e.message); }
};

async function openLesson(id, title) {
  if (!id) return;
  lessonId = id;
  if (title) $("#attTitle").textContent = title;
  const rows = await api(`/api/lessons/${id}/attendance`);
  marks = {};
  rows.forEach(r => marks[r.student_id] = r.status || "present");   // belgilanmagan = Bor
  const list = $("#attList");
  list.className = isAdmin ? "" : "readonly";
  list.innerHTML = rows.map(r => `
    <div class="stu" data-id="${r.student_id}">
      <div class="name">${esc(r.full_name)}</div>
      <div class="seg">${Object.entries(LABEL).map(([k, v]) => `<button data-s="${k}" class="${marks[r.student_id] === k ? "on" : ""}">${v}</button>`).join("")}</div>
    </div>`).join("") || '<span class="muted">Avval talabalarni qo\'shing.</span>';
  $("#attCard").classList.remove("hidden");
  document.querySelectorAll("#lessons button").forEach(b => b.classList.toggle("on", b.textContent === $("#attTitle").textContent));
}

$("#attList").onclick = e => {
  const b = e.target.closest("button[data-s]"); if (!b || !isAdmin) return;
  const row = b.closest(".stu");
  marks[row.dataset.id] = b.dataset.s;
  row.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
};

$("#saveAtt").onclick = async () => {
  const records = Object.entries(marks).map(([student_id, status]) => ({ student_id: +student_id, status }));
  try { await api(`/api/lessons/${lessonId}/attendance`, { method: "PUT", body: JSON.stringify({ records }) }); toast("Saqlandi"); }
  catch (e) { toast(e.message); }
};

// Statistika
async function loadStats() {
  const m = $("#month").value;
  if (!m) return;
  const [rows, tr] = await Promise.all([api("/api/stats?month=" + m), api("/api/stats/trend?month=" + m)]);
  trend = tr; drawChart();
  $("#statTbl").innerHTML = `<tr><th>Talaba</th><th>Bor</th><th>Kechikdi</th><th>Sababli</th><th>Sababsiz</th><th>%</th></tr>` +
    rows.map(r => `<tr><td>${esc(r.full_name)}</td><td>${r.present}</td><td>${r.late}</td><td>${r.excused}</td><td>${r.unexcused}</td><td class="pct">${r.percent ?? "—"}</td></tr>`).join("");
}
// Grafik (oylik): har bir dars kuni uchun
let trend = [], chartMode = "line";
const COL = { present: "var(--present)", late: "var(--late)", excused: "var(--excused)", unexcused: "var(--unexcused)" };
const dm = d => d.slice(8) + "." + d.slice(5, 7);

function drawChart() {
  const box = $("#chart");
  $("#chartInfo").textContent = trend.length ? "Nuqta yoki ustunni bosing — kun tafsiloti chiqadi." : "";
  if (!trend.length) {
    box.innerHTML = '<span class="muted">Bu oyda davomat belgilangan dars yo\'q.</span>';
    $("#legend").innerHTML = ""; return;
  }
  const W = 600, H = 230, L = 38, R = 12, T = 12, B = 30, iw = W - L - R, ih = H - T - B, n = trend.length;
  const y = p => T + ih - p * ih / 100;
  const bw = iw / n;
  const cx = i => L + bw * i + bw / 2;
  const step = Math.ceil(n / 8);
  const grid = [0, 25, 50, 75, 100].map(p =>
    `<line x1="${L}" x2="${W - R}" y1="${y(p)}" y2="${y(p)}" stroke="var(--line)"/>` +
    `<text x="${L - 6}" y="${y(p) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${p}%</text>`).join("");
  const labels = trend.map((t, i) => i % step === 0
    ? `<text x="${cx(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${dm(t.date)}</text>` : "").join("");
  let body;
  if (chartMode === "line") {
    const pts = trend.map((t, i) => `${cx(i)},${y(t.percent)}`).join(" ");
    body = `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>` +
      trend.map((t, i) => `<circle data-i="${i}" cx="${cx(i)}" cy="${y(t.percent)}" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="cursor:pointer"/>`).join("");
    $("#legend").innerHTML = '<span><i style="background:var(--accent)"></i>Kunlik davomat foizi (Bor + Kechikdi)</span>';
  } else {
    body = trend.map((t, i) => {
      let acc = 0;
      return ["present", "late", "excused", "unexcused"].map(k => {
        const p = t.total ? t[k] * 100 / t.total : 0;
        const r = `<rect data-i="${i}" x="${cx(i) - bw * 0.35}" width="${bw * 0.7}" y="${y(acc + p)}" height="${y(acc) - y(acc + p)}" fill="${COL[k]}" style="cursor:pointer"/>`;
        acc += p; return r;
      }).join("");
    }).join("");
    $("#legend").innerHTML = Object.entries(LABEL).map(([k, v]) => `<span><i style="background:${COL[k]}"></i>${v}</span>`).join("");
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Oylik davomat grafigi">${grid}${body}${labels}</svg>`;
}

$("#chart").onclick = e => {
  const el = e.target.closest("[data-i]"); if (!el) return;
  const t = trend[+el.dataset.i];
  $("#chartInfo").textContent = `${dm(t.date)} — Bor ${t.present}, Kechikdi ${t.late}, Sababli ${t.excused}, Sababsiz ${t.unexcused} (${t.percent}%)`;
};

$("#chartMode").onclick = e => {
  const b = e.target.closest("button[data-c]"); if (!b) return;
  chartMode = b.dataset.c;
  document.querySelectorAll("#chartMode button").forEach(x => x.classList.toggle("on", x === b));
  drawChart();
};

// Kunlik statistika
async function loadDay() {
  const d = $("#statDate").value; if (!d) return;
  const lessons = await api("/api/stats/day?lesson_date=" + d);
  $("#dayOut").innerHTML = lessons.length ? lessons.map(l => {
    const badges = l.total ? Object.entries(LABEL).map(([k, v]) => l[k] ? `<span class="badge" style="background:${COL[k]}">${v}: ${l[k]}</span>` : "").join("") : "";
    const abs = !l.total ? '<span class="muted">Davomat hali belgilanmagan.</span>'
      : l.absentees.length ? l.absentees.map(a => `<div class="abs-row"><span>${esc(a.full_name)}</span><span style="color:${COL[a.status]}">${LABEL[a.status]}</span></div>`).join("")

$("#statMode").onclick = e => {

$("#month").onchange = loadStats;

// Dars jadvali
const DAYS = ["", "Dushanba", "Seshanba", "Chorshanba", "Payshanba", "Juma", "Shanba", "Yakshanba"];
let schedule = [];
let editId = null;

function schItem(l) {
  const time = l.start_time ? `<b>${l.start_time}</b>${l.end_time || ""}` : "";
  const meta = [l.room ? `Xona ${esc(l.room)}` : "", esc(l.teacher)].filter(Boolean).join(" · ");
  return `<div class="item">
    <div class="time">${time || l.pair_no + "-juftlik"}</div>
    <div class="info">
      <div class="subj">${l.start_time ? l.pair_no + "-juftlik · " : ""}${esc(l.subject)}</div>
      ${meta ? `<div class="muted">${meta}</div>` : ""}
    </div>
    <div class="acts admin-only${isAdmin ? "" : " hidden"}">
      <button data-edit="${l.id}" aria-label="Tahrirlash">✎</button>
      <button data-del="${l.id}" aria-label="O'chirish">✕</button>
    </div>
  </div>`;
}

function renderSchedule() {
  const d = new Date().getDay(); const todayNo = d === 0 ? 7 : d;
  const byDay = n => schedule.filter(l => l.weekday === n);

  const t = byDay(todayNo);
  $("#schToday").innerHTML = `<div class="card day today"><h2>${DAYS[todayNo]}</h2>` +
    (t.length ? t.map(schItem).join("") : '<span class="muted">Bugun dars yo\'q.</span>') + `</div>`;

  $("#schWeek").innerHTML = [1, 2, 3, 4, 5, 6].filter(n => n !== todayNo).map(n => {
    const list = byDay(n);
    return `<div class="card day"><h2>${DAYS[n]}</h2>` +
      (list.length ? list.map(schItem).join("") : '<span class="muted">Dars yo\'q.</span>') + `</div>`;
  }).join("");
}

async function loadSchedule() {
  schedule = await api("/api/schedule");
  scheduleLoaded = true;
  renderSchedule();
}

function resetSchForm() {
  editId = null;
  ["sStart", "sEnd", "sSubject", "sRoom", "sTeacher"].forEach(id => $("#" + id).value = "");
  $("#sSave").textContent = "Qo'shish";
  $("#schFormTitle").textContent = "Yangi dars qo'shish";
  $("#sCancel").classList.add("hidden");
}

$("#sSave").onclick = async () => {
  const body = {
    weekday: +$("#sDay").value, pair_no: +$("#sPair").value,
    start_time: $("#sStart").value || null, end_time: $("#sEnd").value || null,
    subject: $("#sSubject").value.trim(), room: $("#sRoom").value.trim(), teacher: $("#sTeacher").value.trim()
  };
  if (!body.subject) return toast("Fan nomini yozing");
  try {
    await api(editId ? `/api/schedule/${editId}` : "/api/schedule", { method: editId ? "PUT" : "POST", body: JSON.stringify(body) });
    toast(editId ? "O'zgarishlar saqlandi" : "Dars qo'shildi");
    resetSchForm(); loadSchedule();
  } catch (e) { toast(e.message); }
};
$("#sCancel").onclick = resetSchForm;

$("#tab-sch").onclick = async e => {
  const ed = e.target.closest("[data-edit]"), del = e.target.closest("[data-del]");
  if (ed) {
    const l = schedule.find(x => x.id === +ed.dataset.edit); if (!l) return;
    editId = l.id;
    $("#sDay").value = l.weekday; $("#sPair").value = l.pair_no;
    $("#sStart").value = l.start_time || ""; $("#sEnd").value = l.end_time || "";
    $("#sSubject").value = l.subject; $("#sRoom").value = l.room; $("#sTeacher").value = l.teacher;
    $("#sSave").textContent = "O'zgarishlarni saqlash";
    $("#schFormTitle").textContent = "Darsni tahrirlash";
    $("#sCancel").classList.remove("hidden");

  if (del && confirm("Bu darsni jadvaldan o'chirasizmi?")) {
    try { await api(`/api/schedule/${del.dataset.del}`, { method: "DELETE" }); toast("O'chirildi"); loadSchedule(); }
    catch (err) { toast(err.message); }
  }
};

// Hujjatlar
let groupCode = localStorage.getItem("groupCode") || "";
let docs = [], cats = [], docTag = "", docEdit = null;

async function apiForm(path, fd, method = "POST") {
  const res = await fetch(path, { method, body: fd, headers: { "X-Admin-Token": token, "X-Group-Code": groupCode } });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || "Xatolik yuz berdi"); }
  return res.json();
}

function showGate(msg) {
  $("#docMain").classList.add("hidden");
  $("#docGate").classList.remove("hidden");
  if (msg) toast(msg);
}

async function openDocs() {
  if (!isAdmin && !groupCode) return showGate();
  try { await api("/api/access"); }
  catch (e) {
    if (!isAdmin) { groupCode = ""; localStorage.removeItem("groupCode"); return showGate(e.message); }
    return toast(e.message);
  }
  $("#docGate").classList.add("hidden");
  $("#docMain").classList.remove("hidden");
  await loadDocs();
}
function refreshDocsIfOpen() { if (!$("#tab-doc").classList.contains("hidden")) openDocs(); }

$("#gateBtn").onclick = () => {
  const code = $("#gateCode").value.trim();
  if (!code) return;
  if (!/^[\x20-\x7E]+$/.test(code)) return toast("Kod faqat lotin harf va raqamlardan iborat");
  groupCode = code; localStorage.setItem("groupCode", code);
  $("#gateCode").value = "";
  openDocs();
};
$("#gateCode").onkeydown = e => { if (e.key === "Enter") $("#gateBtn").click(); };

async function loadDocs() {
  [cats, docs] = await Promise.all([api("/api/categories"), api("/api/documents")]);
  fillCats(); renderDocs();
}

function fillCats() {
  const cur = $("#docCat").value;
  $("#docCat").innerHTML = '<option value="">Barcha kategoriyalar</option>' + cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  $("#docCat").value = cats.some(c => String(c.id) === cur) ? cur : "";
  const f = $("#docCategory").value;
  $("#docCategory").innerHTML = '<option value="">Kategoriyasiz</option>' + cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  $("#docCategory").value = f;
  $("#catList").innerHTML = cats.map(c => `<div class="stu" style="display:flex;gap:6px;align-items:center"><span style="flex:1">${esc(c.name)}</span><button data-catdel="${c.id}" data-name="${esc(c.name)}" aria-label="O'chirish">✕</button></div>`).join("") || '<span class="muted">Kategoriya yo\'q.</span>';
}

function kindLabel(d) {
  if (d.kind === "link") return "Havola";
  const m = d.mime || "", n = (d.file_name || "").toLowerCase();
  if (m === "application/pdf" || n.endsWith(".pdf")) return "PDF";
  if (m.startsWith("image/")) return "Rasm";
  if (/\.(docx?|odt)$/.test(n)) return "Word";
  if (/\.(xlsx?|csv)$/.test(n)) return "Excel";
  if (/\.pptx?$/.test(n)) return "PowerPoint";
  return "Fayl";
}
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const fmtDate = s => { const d = new Date(s); return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear(); };

function renderDocs() {
  const q = $("#docQ").value.trim().toLowerCase(), cat = $("#docCat").value;
  const allTags = [...new Set(docs.flatMap(d => d.tags))].sort((a, b) => a.localeCompare(b));
  if (docTag && !allTags.includes(docTag)) docTag = "";
  $("#docTags").innerHTML = allTags.map(t => `<button data-tag="${esc(t)}" class="${t === docTag ? "on" : ""}">#${esc(t)}</button>`).join("");

  const list = docs.filter(d =>
    (!cat || String(d.category_id) === cat) &&
    (!docTag || d.tags.includes(docTag)) &&
    (!q || [d.title, d.note, d.file_name || "", ...d.tags].join(" ").toLowerCase().includes(q)));

  $("#docList").innerHTML = list.map(d => {
    const meta = [d.category ? esc(d.category) : "", kindLabel(d) + (d.size ? " · " + fmtSize(d.size) : ""), fmtDate(d.created_at)].filter(Boolean).join(" · ");
    return `<div class="card doc">
      <div class="dtitle">${d.pinned ? "📌 " : ""}${esc(d.title)}</div>
      <div class="muted">${meta}</div>
      ${d.note ? `<div>${esc(d.note)}</div>` : ""}
      ${d.tags.length ? `<div class="tags">${d.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</div>` : ""}
      <div class="dacts">
        <button class="primary" data-open="${d.id}">Ochish</button>
        <button class="admin-only${isAdmin ? "" : " hidden"}" data-pin="${d.id}" aria-label="Mahkamlash">${d.pinned ? "Yechish" : "📌"}</button>
        <button class="admin-only${isAdmin ? "" : " hidden"}" data-dedit="${d.id}" aria-label="Tahrirlash">✎</button>
        <button class="admin-only${isAdmin ? "" : " hidden"}" data-ddel="${d.id}" aria-label="O'chirish">✕</button>
      </div></div>`;
  }).join("") || `<div class="card muted">${docs.length ? "Hech narsa topilmadi." : "Hozircha hujjat yo'q."}</div>`;
}

$("#docQ").oninput = renderDocs;
$("#docCat").onchange = renderDocs;
$("#docTags").onclick = e => { const b = e.target.closest("[data-tag]"); if (!b) return; docTag = docTag === b.dataset.tag ? "" : b.dataset.tag; renderDocs(); };

function openUrl(u) { const w = window.open(u, "_blank"); if (w) w.opener = null; else location.href = u; }

const docBody = (d, over = {}) => ({ title: d.title, category_id: d.category_id, tags: d.tags, note: d.note, pinned: d.pinned, url: d.url, ...over });

$("#docList").onclick = async e => {
  const open = e.target.closest("[data-open]"), pin = e.target.closest("[data-pin]"),
        ed = e.target.closest("[data-dedit]"), del = e.target.closest("[data-ddel]");
  try {
    if (open) {
      const d = docs.find(x => x.id === +open.dataset.open); if (!d) return;
      if (d.kind === "link") return openUrl(d.url);
      const r = await api(`/api/documents/${d.id}/open`);
      openUrl(r.url);
    }
    if (pin) {
      const d = docs.find(x => x.id === +pin.dataset.pin);
      await api(`/api/documents/${d.id}`, { method: "PUT", body: JSON.stringify(docBody(d, { pinned: !d.pinned })) });
      await loadDocs();
    }
    if (ed) startEdit(docs.find(x => x.id === +ed.dataset.dedit));
    if (del) {
      const d = docs.find(x => x.id === +del.dataset.ddel);
      if (confirm(`"${d.title}" o'chiriladi. Davom etasizmi?`)) {
        await api(`/api/documents/${d.id}`, { method: "DELETE" });
        toast("O'chirildi"); await loadDocs();
      }
    }
  } catch (err) { toast(err.message); }
};

// Hujjat qo'shish / tahrirlash formasi
function resetDocForm() {
  docEdit = null;
  ["docTitle", "docTagsIn", "docNote", "docLink", "docFile"].forEach(id => $("#" + id).value = "");
  $("#docCategory").value = "";
  $("#docFormTitle").textContent = "Yangi hujjat";
  $("#docFileLabel").textContent = "Fayl yuklash (25 MB gacha)";
  $("#docLinkLabel").textContent = "yoki havola";
  $("#docFileBox").classList.remove("hidden"); $("#docLinkBox").classList.remove("hidden");
  $("#docSave").disabled = false; $("#docSave").textContent = "Saqlash";
}

function startEdit(d) {
  resetDocForm();
  docEdit = d;
  $("#docFormTitle").textContent = "Hujjatni tahrirlash";
  $("#docTitle").value = d.title; $("#docCategory").value = d.category_id ?? "";
  $("#docTagsIn").value = d.tags.join(", "); $("#docNote").value = d.note;
  if (d.kind === "link") { $("#docFileBox").classList.add("hidden"); $("#docLinkLabel").textContent = "Havola"; $("#docLink").value = d.url || ""; }
  else { $("#docLinkBox").classList.add("hidden"); $("#docFileLabel").textContent = `Faylni almashtirish (ixtiyoriy). Hozirgi: ${d.file_name || ""}`; }
  $("#docForm").classList.remove("hidden");
  $("#docForm").scrollIntoView({ behavior: "smooth" });
}

$("#docAddBtn").onclick = () => { resetDocForm(); $("#docForm").classList.toggle("hidden"); $("#catBox").classList.add("hidden"); };
$("#docCancel").onclick = () => { resetDocForm(); $("#docForm").classList.add("hidden"); };

$("#docSave").onclick = async () => {
  const title = $("#docTitle").value.trim();
  if (!title) return toast("Hujjat nomini yozing");
  const file = $("#docFile").files[0], link = $("#docLink").value.trim();
  const btn = $("#docSave"); btn.disabled = true; btn.textContent = file ? "Yuklanmoqda..." : "Saqlanmoqda...";
  try {
    if (docEdit) {
      const tags = $("#docTagsIn").value.split(",");
      await api(`/api/documents/${docEdit.id}`, { method: "PUT", body: JSON.stringify(docBody(docEdit, { title, category_id: $("#docCategory").value ? +$("#docCategory").value : null, tags, note: $("#docNote").value, url: link || docEdit.url })) });
      if (file && docEdit.kind === "file") { const fd = new FormData(); fd.append("file", file); await apiForm(`/api/documents/${docEdit.id}/file`, fd); }
    } else {
      if (!file && !link) throw new Error("Fayl tanlang yoki havola kiriting");
      if (file && link) throw new Error("Fayl yoki havoladan faqat bittasini kiriting");
      const fd = new FormData();
      fd.append("title", title); fd.append("category_id", $("#docCategory").value);
      fd.append("tags", $("#docTagsIn").value); fd.append("note", $("#docNote").value);
      if (file) fd.append("file", file); else fd.append("link", link);
      await apiForm("/api/documents", fd);
    }
    toast("Saqlandi");
    resetDocForm(); $("#docForm").classList.add("hidden");
    await loadDocs();
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = "Saqlash"; }
};

// Kategoriyalar
$("#catBtn").onclick = () => { $("#catBox").classList.toggle("hidden"); $("#docForm").classList.add("hidden"); };
$("#catAdd").onclick = async () => {
  const name = $("#catName").value.trim(); if (!name) return;
  try { await api("/api/categories", { method: "POST", body: JSON.stringify({ name }) }); $("#catName").value = ""; await loadDocs(); }
  catch (e) { toast(e.message); }
};
$("#catList").onclick = async e => {
  const b = e.target.closest("[data-catdel]"); if (!b) return;
  if (!confirm(`"${b.dataset.name}" kategoriyasi o'chiriladi. Hujjatlar o'chmaydi, kategoriyasiz qoladi. Davom etasizmi?`)) return;
  try { await api(`/api/categories/${b.dataset.catdel}`, { method: "DELETE" }); await loadDocs(); }
  catch (err) { toast(err.message); }
};
